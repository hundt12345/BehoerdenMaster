# Render Blueprint: ein kostenloser Python-Web-Service (Render Free, ohne Disk).
#
# Achtung: Free-Services haben kein persistentes Dateisystem. Die SQLite-Datenbank liegt
# in /tmp und wird bei Neustart/Redeploy/Schlafmodus neu angelegt. Der Hintergrundabruf
# füllt sie deshalb nach jedem Start erneut; BEHOERDEN_SYNC_SEIT hält diesen Erstabruf
# klein (rollierendes Fenster statt fester Jahresbeginn).
# Für dauerhafte Daten ohne erneuten Abruf: bezahlter Tarif plus Disk (siehe docs/render.md).
#
# Branch absichtlich nicht festgelegt: Render verwendet den ausgewählten Blueprint-Branch.
services:
  - type: web
    name: behoerdenmaster
    runtime: python
    region: frankfurt
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: python -m pip install -e .
    startCommand: python -m behoerdenmaster -v serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: BEHOERDEN_DB
        value: /tmp/behoerdenmaster/behoerdenmaster.sqlite
      - key: BEHOERDEN_CONFIG_DIR
        value: /opt/render/project/src/config/cities
      # Keine Beispieldaten: Die Seite soll echte Vorgänge zeigen und einen leeren Bestand
      # offen erklären, statt Offline-Auszüge als Treffer auszugeben.
      - key: BEHOERDEN_DEMO
        value: "false"
      # Automatischer Abruf. Die Reihenfolge legt die Start- und Rückgabereihenfolge der
      # Etappe fest: erst die kleinen, schnell vollständigen Quellen (Bekanntmachungen,
      # Beteiligung, die drei RSS-Feeds – je Quelle wenige Anfragen), zuletzt die
      # Ratsinformation (OParl) mit ihrem großen Erstabruf. Die fälligen Quellen laufen
      # parallel (siehe BEHOERDEN_SYNC_PARALLEL); pro Host bleibt der Mindestabstand
      # zwischen Anfragen erhalten, sodass die Last je Behörden-Server unverändert ist.
      # Bauleitplanung bleibt bis zur Klärung des dortigen Fehlers ausgenommen
      # (siehe docs/quellen-koeln.md). "false" schaltet den Hintergrundabruf bewusst ab.
      - key: BEHOERDEN_SYNC_ENABLED
        value: "true"
      - key: BEHOERDEN_SYNC_QUELLEN
        value: koeln:bekanntmachungen,koeln:beteiligung,koeln:opendata,koeln:ris-rss,koeln:presse-rss,koeln:verkehrskalender,koeln:ris
      # Rollierendes Fenster für den Erstabruf: 90 Tage statt des in koeln.toml hinterlegten
      # Wahlperiodenbeginns. Hält den Abruf nach jedem Neustart klein und höflich.
      - key: BEHOERDEN_SYNC_SEIT
        value: "90"
      - key: BEHOERDEN_SYNC_INTERVALL
        value: "21600"
      - key: BEHOERDEN_SYNC_MAX_ANFRAGEN
        value: "120"
      # Gleichzeitige Quellen je Etappe. Verschiedene Hosts laufen parallel; Quellen auf
      # demselben Host (z. B. Ratsinformation und ihr RSS-Feed) teilen sich weiterhin
      # ihre Drossel. 1 schaltet bewusst auf strikt sequenzielle Abrufe.
      - key: BEHOERDEN_SYNC_PARALLEL
        value: "3"
      # Zeitfenster je Quelle und Etappe: Nach Ablauf wird die Quelle unterbrochen und
      # beim nächsten Mal an ihrem gespeicherten Cursor fortgesetzt; ein knappes Fenster
      # hält auch den großen Erstabruf der Ratsinformation in Etappen.
      - key: BEHOERDEN_SYNC_ZEITBUDGET
        value: "240"
      - key: BEHOERDEN_SYNC_STARTVERZOEGERUNG
        value: "15"
      # Erreichbare Kontaktadresse für den identifizierbaren User-Agent. Sie steht bewusst
      # im Repository (siehe config.py: PROJEKT_KONTAKT), damit ein Deployment auch ohne
      # eigene Env-Werte abruft statt dauerhaft leer zu bleiben. Eigene Instanzen sollten
      # sie durch eine eigene, erreichbare Adresse ersetzen.
      - key: BEHOERDEN_KONTAKT
        value: "behordenkontakt123@posteo.de"
      # Laden auf Abruf: Aachen, Bonn, Düsseldorf, Münster und Wuppertal werden erst geladen,
      # wenn jemand sie auswählt (siehe docs/staedte.md). Auf der Free-Instanz höchstens zwei
      # gleichzeitig, damit der Erstabruf nach einem Neustart klein bleibt. Ohne Disk geht
      # der Anforderungsvermerk beim Neustart verloren; die Stadt wird dann neu angefordert.
      - key: BEHOERDEN_AUF_ABRUF
        value: "true"
      - key: BEHOERDEN_AUF_ABRUF_TAGE
        value: "14"
      - key: BEHOERDEN_AUF_ABRUF_MAX
        value: "2"
      # Impressum/Datenschutz: BEHOERDEN_BETREIBER_NAME, _ANSCHRIFT, _EMAIL (optional _TELEFON,
      # _VERANTWORTLICH) im Render-Dashboard setzen – bewusst nicht im Repository.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Render terminiert HTTPS vor Uvicorn.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
