# Stadt Düsseldorf – Konfiguration für BehoerdenMaster
#
# Angebunden nach demselben System wie Köln: Ratsinformation über OParl (gleicher Adapter,
# gleiche Drossel, robots.txt, Budgets und Abkühlzeiten). Die zehn Stadtbezirke tragen amtlich nur Nummern („Stadtbezirk 1“ … „Stadtbezirk 10“). Das OParl-System wird von ITK Rheinland betrieben und kann mehrere Kommunen führen; die Körperschaft wird deshalb über ihren Namen gewählt.
#
# Quellen:
#   * OParl-Endpunkt: offizielle OParl-Endpunktliste (github.com/OParl/resources, endpoints.yml,
#     abgerufen am 14.10.2026). Der Endpunkt ist von hier aus NICHT live geprüft (die
#     Entwicklungsumgebung erreicht keine Behörden-Hosts) – vor dem ersten Lauf:
#       python -m behoerdenmaster --stadt duesseldorf probe --quelle ris
#   * Ortsgliederung, PLZ und Straßen: OpenStreetMap-Auszug der OpenPLZ API (ODbL 1.0,
#     © OpenStreetMap-Mitwirkende), erzeugt mit tools/stadt_aus_osm.py. Eine NÄHERUNG.
#
# Abruf auf Anforderung: Die Stadt wird erst geladen, wenn jemand sie in der Oberfläche
# auswählt oder in ihr sucht (siehe README, „Weitere Städte – Laden auf Abruf“).

[stadt]
schluessel = "duesseldorf"
name = "Düsseldorf"
aliase = ["duesseldorf", "landeshauptstadt düsseldorf", "stadt düsseldorf"]
ags = "05111000"
bundesland = "Nordrhein-Westfalen"
abruf = "auf_abruf"
gliederung_quelle = "Stadtbezirke und Stadtteile aus dem OSM-Auszug der OpenPLZ API (ODbL 1.0), erzeugt mit tools/stadt_aus_osm.py"
hinweis = "Ortsbezug aus Betreff und Gremium abgeleitet; Ortsgliederung und PLZ aus einem OpenStreetMap-Auszug (Näherung)."

[[quellen]]
schluessel = "ris"
typ = "oparl"
name = "Ratsinformation Düsseldorf (OParl)"
system_url = "https://ris-oparl.itk-rheinland.de/Oparl/system"
# Körperschaft über den Namen wählen; passen mehrere, bricht der Lauf ab statt zu raten.
koerperschaft = "Düsseldorf"
# Rollierendes Fenster für den Erstabruf (90 Tage), damit eine neu angeforderte Stadt
# klein und höflich startet. Folgeläufe holen nur Änderungen.
seit = "90d"
min_intervall_sekunden = 3.0
lizenz = "Nicht geprüft – vor einer Veröffentlichung die Lizenzangabe des OParl-Systems bzw. der Stadt prüfen"
pruefstand = "Endpunkt aus der OParl-Endpunktliste (Stand 14.10.2026); noch kein Abruf – vor dem ersten Lauf probe ausführen"

[[themen]]
schluessel = "bauen"
bezeichnung = "Bauvorhaben & Bauleitplanung"
begriffe = ["Bauvorhaben", "Bauprojekt", "Bauleitplan", "Bebauungsplan", "Bebauung", "Flächennutzungsplan", "Aufstellungsbeschluss", "Satzungsbeschluss", "Offenlage", "Arbeitstitel", "Städtebau", "Baugebiet", "Bauantrag", "Baugenehmigung", "Neubau", "Wohnungsbau", "Wohnbebauung", "Nachverdichtung", "vorhabenbezogen", "Hochhaus", "Quartier", "Abriss", "Umbau"]

[[themen]]
schluessel = "verkehr"
bezeichnung = "Verkehr & Mobilität"
begriffe = ["Verkehr", "Radweg", "Radverkehr", "Fahrradstraße", "Fahrrad", "Parkraum", "Parken", "Ampel", "Stadtbahn", "Buslinie", "Haltestelle", "Mobilität", "Fußverkehr", "Kreuzung", "Straßenbahn", "Tempo"]

[[themen]]
schluessel = "schulen"
bezeichnung = "Schulen & Kitas"
begriffe = ["Schule", "Kita", "Kindergarten", "Kindertagesstätte", "Jugendamt"]

[[themen]]
schluessel = "gruen"
bezeichnung = "Grün & Klima"
begriffe = ["Grün", "Grünzug", "Park", "Spielplatz", "Baum", "Bäume", "Klima", "Stadtgrün"]

[erzeugung]
# Steuerung für tools/stadt_aus_osm.py – von der Anwendung ignoriert.
stadtteile = true
bezirke = [
  { osm = "Stadtbezirk 1", nr = "1", name = "Stadtbezirk 1" },
  { osm = "Stadtbezirk 2", nr = "2", name = "Stadtbezirk 2" },
  { osm = "Stadtbezirk 3", nr = "3", name = "Stadtbezirk 3" },
  { osm = "Stadtbezirk 4", nr = "4", name = "Stadtbezirk 4" },
  { osm = "Stadtbezirk 5", nr = "5", name = "Stadtbezirk 5" },
  { osm = "Stadtbezirk 6", nr = "6", name = "Stadtbezirk 6" },
  { osm = "Stadtbezirk 7", nr = "7", name = "Stadtbezirk 7" },
  { osm = "Stadtbezirk 8", nr = "8", name = "Stadtbezirk 8" },
  { osm = "Stadtbezirk 9", nr = "9", name = "Stadtbezirk 9" },
  { osm = "Stadtbezirk 10", nr = "10", name = "Stadtbezirk 10" },
]

