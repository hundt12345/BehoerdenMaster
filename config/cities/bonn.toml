# Stadt Bonn – Konfiguration für BehoerdenMaster
#
# Angebunden nach demselben System wie Köln: Ratsinformation über OParl (gleicher Adapter,
# gleiche Drossel, robots.txt, Budgets und Abkühlzeiten). Der Stadtbezirk „Bonn“ heißt hier „Stadtbezirk Bonn“, damit nicht jede Nennung der Stadt als Bezirk zählt.
#
# Quellen:
#   * OParl-Endpunkt: Die früher übliche Adresse /public/oparl/system steht seit dem
#     24.02.2026 hinter einer Zugangsprüfung (ALTCHA-Proof-of-Work, HTTP 403 für
#     Maschinen-Clients; öffentlich dokumentiert in mandariOSS/mandari, Issue #88).
#     Seit dem 02.10.2026 bietet Bonn OParl (ALLRIS, OParl 1.1) unter der neuen Adresse
#     /oparl/system wieder ohne Zugangsprüfung an (ebenda). Die Dokument-Links unter
#     /public/doc… liegen weiterhin hinter der Prüfseite – wir übernehmen wie überall
#     nur Links, keine Dateien. Der Endpunkt ist aus der Entwicklungsumgebung nicht
#     live prüfbar (Behörden-Hosts sind von dort nicht erreichbar) – vor dem ersten Lauf:
#       python -m behoerdenmaster --stadt bonn probe --quelle ris
#     Liefert auch die neue Adresse HTTP 403 (zuerst wird robots.txt gelesen), ist der
#     Bot-Schutz für den abrufenden Host noch aktiv; dann bleibt nur die Bitte an die
#     Stadt Bonn, /oparl/ und /robots.txt für Maschinen-Clients freizugeben – eine
#     Umgehung der Zugangsprüfung findet nicht statt.
#   * Ortsgliederung, PLZ und Straßen: OpenStreetMap-Auszug der OpenPLZ API (ODbL 1.0,
#     © OpenStreetMap-Mitwirkende), erzeugt mit tools/stadt_aus_osm.py. Eine NÄHERUNG.
#
# Abruf auf Anforderung: Die Stadt wird erst geladen, wenn jemand sie in der Oberfläche
# auswählt oder in ihr sucht (siehe README, „Weitere Städte – Laden auf Abruf“).

[stadt]
schluessel = "bonn"
name = "Bonn"
aliase = ["stadt bonn", "bundesstadt bonn"]
ags = "05314000"
bundesland = "Nordrhein-Westfalen"
abruf = "auf_abruf"
gliederung_quelle = "Stadtbezirke und Stadtteile aus dem OSM-Auszug der OpenPLZ API (ODbL 1.0), erzeugt mit tools/stadt_aus_osm.py"
hinweis = "Ortsbezug aus Betreff und Gremium abgeleitet; Ortsgliederung und PLZ aus einem OpenStreetMap-Auszug (Näherung)."

[[quellen]]
schluessel = "ris"
typ = "oparl"
name = "Ratsinformation Bonn (OParl)"
system_url = "https://www.bonn.sitzung-online.de/oparl/system"
# Körperschaft über den Namen wählen; passen mehrere, bricht der Lauf ab statt zu raten.
koerperschaft = "Bonn"
# Rollierendes Fenster für den Erstabruf (90 Tage), damit eine neu angeforderte Stadt
# klein und höflich startet. Folgeläufe holen nur Änderungen.
seit = "90d"
min_intervall_sekunden = 3.0
lizenz = "Nicht geprüft – vor einer Veröffentlichung die Lizenzangabe des OParl-Systems bzw. der Stadt prüfen"
pruefstand = "Auf die neue, seit dem 02.10.2026 wieder offene /oparl/-Adresse umgestellt (alte /public/-Adresse seit dem 24.02.2026 hinter einer Zugangsprüfung, HTTP 403; mandariOSS/mandari, Issue #88). Host aus der Entwicklungsumgebung nicht erreichbar – vor dem ersten Lauf probe ausführen; kein Umgehen einer Zugangsprüfung."

[[themen]]
schluessel = "bauen"
bezeichnung = "Bauvorhaben & Bauleitplanung"
begriffe = ["Bauvorhaben", "Bauprojekt", "Bauleitplan", "Bebauungsplan", "Bebauung", "Flächennutzungsplan", "Aufstellungsbeschluss", "Satzungsbeschluss", "Offenlage", "Arbeitstitel", "Städtebau", "Baugebiet", "Bauantrag", "Baugenehmigung", "Neubau", "Wohnungsbau", "Wohnbebauung", "Nachverdichtung", "vorhabenbezogen", "Hochhaus", "Quartier", "Abriss", "Umbau"]

[[themen]]
schluessel = "verkehr"
bezeichnung = "Verkehr & Mobilität"
begriffe = ["Verkehr", "Radweg", "Radverkehr", "Fahrradstraße", "Fahrrad", "Parkraum", "Parken", "Ampel", "Stadtbahn", "Buslinie", "Haltestelle", "Mobilität", "Fußverkehr", "Kreuzung", "Straßenbahn", "Tempo"]

[[themen]]
schluessel = "schulen"
bezeichnung = "Schulen & Kitas"
begriffe = ["Schule", "Kita", "Kindergarten", "Kindertagesstätte", "Jugendamt"]

[[themen]]
schluessel = "gruen"
bezeichnung = "Grün & Klima"
begriffe = ["Grün", "Grünzug", "Park", "Spielplatz", "Baum", "Bäume", "Klima", "Stadtgrün"]

[erzeugung]
# Steuerung für tools/stadt_aus_osm.py – von der Anwendung ignoriert.
stadtteile = true
bezirke = [
  { osm = "Stadtbezirk Bonn", nr = "1", name = "Stadtbezirk Bonn", aliase = ["Bezirksvertretung Bonn"] },
  { osm = "Bad Godesberg", nr = "2", name = "Bad Godesberg", aliase = ["Bonn-Bad Godesberg"] },
  { osm = "Bonn-Beuel", nr = "3", name = "Beuel", aliase = ["Bonn-Beuel"] },
  { osm = "Hardtberg", nr = "4", name = "Hardtberg", aliase = ["Bonn-Hardtberg"] },
]

