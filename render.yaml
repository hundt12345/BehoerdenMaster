# Render Blueprint: ein kostenloser Python-Web-Service (Render Free, ohne Disk).
# Achtung: Free-Services haben kein persistentes Dateisystem. Die SQLite-Datenbank liegt
# in /tmp und wird bei Neustart/Redeploy/Schlafmodus neu angelegt; die klar markierte
# Offline-Demo wird dann beim Start automatisch wieder geladen. Live-Abrufe sind aus.
# Für dauerhafte Daten: plan auf einen bezahlten Tarif und eine Disk (siehe docs/render.md).
# Branch absichtlich nicht festgelegt: Render verwendet den ausgewählten Blueprint-Branch.
services:
  - type: web
    name: behoerdenmaster
    runtime: python
    region: frankfurt
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: python -m pip install -e .
    startCommand: python -m behoerdenmaster -v serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: BEHOERDEN_DB
        value: /tmp/behoerdenmaster/behoerdenmaster.sqlite
      - key: BEHOERDEN_CONFIG_DIR
        value: /opt/render/project/src/config/cities
      # Einmalige, in jedem Treffer markierte Demo, damit der erste Deploy etwas zeigt.
      - key: BEHOERDEN_DEMO
        value: "true"
      # Live-Abrufe bleiben aus. Vor Aktivierung Probelauf und Abrufgrenzen klären.
      - key: BEHOERDEN_SYNC_ENABLED
        value: "false"
      - key: BEHOERDEN_SYNC_QUELLEN
        value: koeln:bauleitplanung,koeln:ris
      - key: BEHOERDEN_SYNC_INTERVALL
        value: "21600"
      - key: BEHOERDEN_SYNC_MAX_ANFRAGEN
        value: "100"
      - key: BEHOERDEN_SYNC_STARTVERZOEGERUNG
        value: "30"
      # Render fragt nach der eigenen erreichbaren Kontaktadresse; kein Wert im Git-Repo.
      - key: BEHOERDEN_KONTAKT
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Render terminiert HTTPS vor Uvicorn.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
