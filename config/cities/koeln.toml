# Stadt Köln – Konfiguration für BehoerdenMaster
#
# Quellen:
#   * Stadtbezirke und Stadtteile: Wikipedia „Liste der Stadtbezirke und Stadtteile Kölns“
#     (9 Stadtbezirke, 86 Stadtteile; Nummerierung der Stadt Köln).
#   * PLZ-Zuordnung und Straßennamen: Straßenverzeichnis in koeln.strassen.tsv, abgeleitet aus
#     einem OpenStreetMap-Auszug der OpenPLZ API (ODbL 1.0, © OpenStreetMap-Mitwirkende,
#     Stand 13.10.2026). Werkzeug: tools/strassen_aus_osm.py. Beides ist eine NÄHERUNG:
#     PLZ-Gebiete und Stadtteilgrenzen decken sich nicht immer sauber, und Straßennamen
#     können in mehreren Stadtteilen vorkommen.
#   * Quelle: Ratsinformationssystem Köln, OParl 1.1 (Lizenz: Datenlizenz Deutschland – Zero – 2.0).
#   * Quelle: Bauleitplanung Online NRW, öffentliche Köln-Suche (keine pauschale offene Lizenz verifiziert).
#
# Hinweis: Ortsbezug aus Betreff/Gremiennamen bzw. öffentlicher Planbeschreibung ist eine Heuristik.
# Die OParl-Schnittstelle der Stadt liefert dafür derzeit keine verlässlichen Ortsangaben.
# Zusätzlich lösen eindeutige Straßennamen aus dem Straßenverzeichnis einen Stadtteil auf.

[stadt]
schluessel = "koeln"
name = "Köln"
aliase = ["stadt koeln", "koeln", "cologne"]
ags = "05315000"
hinweis = "Ortsbezug aus Betreff, Gremium bzw. öffentlicher Planbeschreibung abgeleitet; PLZ-Zuordnung ist eine Näherung."

[[quellen]]
schluessel = "ris"
typ = "oparl"
name = "Ratsinformationssystem Köln (OParl 1.1)"
system_url = "https://buergerinfo.stadt-koeln.de/oparl/system"
body_id = "stadtverwaltung_koeln"
# Erster Abruf: Objekte, die seit diesem Datum angelegt oder geändert wurden.
seit = "2025-11-01"
# Höflichkeit: Mindestabstand zwischen zwei Anfragen. Zu viele
# Anfragen können zu Sperren führen (Vermutung von mandari, Issues #89 und #348; nicht von der Stadt bestätigt). Vor einem
# vollständigen Abruf die Stadt kontaktieren und diesen Wert ggf. anpassen.
min_intervall_sekunden = 3.0
# Web-Links zur Originalansicht (SessionNet). Die OParl-IDs entsprechen den Nummern der HTML-Seiten.
web_vorlage = "https://ratsinformation.stadt-koeln.de/vo0050.asp?__kvonr={id}"
web_sitzung = "https://ratsinformation.stadt-koeln.de/si0057.asp?__ksinr={id}"
web_gremium = "https://ratsinformation.stadt-koeln.de/kp0040.asp?__kgrnr={id}"
lizenz = "Datenlizenz Deutschland – Zero – Version 2.0"

# Öffentliche JSON-Suche der NRW-Plattform demosPlan (nur die Organisation Köln).
# Es werden keine Anmeldung, internen Felder oder Stellungnahmen abgerufen.
[[quellen]]
schluessel = "bauleitplanung"
typ = "bauleitplanung"
name = "Bauleitplanung Online Köln"
system_url = "https://nw.bauleitplanung-online.de/verfahren/suche/ajax?orgaSlug=koeln"
organisation = "Stadt Köln - 61 Stadtplanungsamt"
min_intervall_sekunden = 3.0
# Die UUID aus der öffentlichen API ist zugleich die ID der Verfahrensseite.
web_vorlage = "https://nw.bauleitplanung-online.de/verfahren/{id}/public/detail"
lizenz = "Öffentliche Verfahrensinformationen; Nutzungsbedingungen der Plattform beachten"

# RSS-Feed der Ratsinformation (SessionNet): Sitzungstermine als Hinweis. Ergänzt OParl, ersetzt es nicht.
# Die Nummer aus rssgo.asp?siNNNN entspricht OParl meetings/NNNN. robots.txt: keine Sperre für unbekannte Clients.
[[quellen]]
schluessel = "ris-rss"
typ = "ris-rss"
name = "Sitzungstermine Ratsinformation (RSS)"
system_url = "https://buergerinfo.stadt-koeln.de/rssfeed.asp?id=1&filter=snvf"
min_intervall_sekunden = 3.0
lizenz = "Datenlizenz Deutschland – Zero – Version 2.0 (laut docs/quellen-koeln.md, je Feed bestätigen)"

# Pressemitteilungen der Stadt Köln als RSS. Nur Titel, Datum, Link und Kurztext; keine Volltexte Dritter.
[[quellen]]
schluessel = "presse-rss"
typ = "presse-rss"
name = "Pressemeldungen Stadt Köln (RSS)"
system_url = "https://www.stadt-koeln.de/externe-dienste/rss/pressemeldungen.xml"
min_intervall_sekunden = 3.0
lizenz = "Datenlizenz Deutschland – Namensnennung – Version 2.0 (laut Datensatz \"Pressemeldungen\" auf offenedaten-koeln.de; der Feed selbst nennt keine Lizenz)"

# Öffentliche Bekanntmachungen der Stadt (Amtsblatt-Struktur, keine offene Lizenz nötig/keine
# zugesichert). Übernommen werden Titel, Datum, Hinweisveröffentlichung und der Link auf die
# Bekanntmachung; die PDF-Datei wird NICHT geladen. Der Jahrgang der Liste wird je Lauf neu
# gelesen (die Quelle bietet keinen Änderungsfilter), ältere Jahrgänge bleiben im Bestand.
[[quellen]]
schluessel = "bekanntmachungen"
typ = "bekanntmachungen"
name = "Öffentliche Bekanntmachungen Stadt Köln"
system_url = "https://www.stadt-koeln.de/politik-und-verwaltung/bekanntmachungen/oeffentliche-bekanntmachungen-2026"
listen_vorlage = "https://www.stadt-koeln.de/politik-und-verwaltung/bekanntmachungen/oeffentliche-bekanntmachungen-{jahr}"
# Ältester zu prüfender Jahrgang; ein Lauf prüft höchstens drei Jahrgänge (neueste zuerst).
start_jahr = 2025
min_intervall_sekunden = 3.0
lizenz = "Amtliche Bekanntmachung; keine offene Lizenz zugesichert – nur Titel, Datum und Link werden übernommen"

# Bürgerbeteiligung „Meinung für Köln“: öffentliche Projektliste. Übernommen werden Titel,
# Statuszeile der Plattform, Kurztext und Link. Keine Beiträge, Kommentare, Namen oder Fotos
# Dritter, keine Detailseiten. robots.txt: für unbekannte Clients erlaubt, Crawl-delay 5 s.
[[quellen]]
schluessel = "beteiligung"
typ = "beteiligung"
name = "Bürgerbeteiligung Meinung für Köln"
system_url = "https://meinungfuer.koeln/mitmachen/alle-projekte"
min_intervall_sekunden = 5.0
lizenz = "Keine offene Lizenz zugesichert; nur Titel, Statuszeile, Kurztext und Link der städtischen Projektseite"

# Offene Daten Köln (DKAN 2): Katalog und Tabellenspeicher („Datastore“) des
# städtischen Open-Data-Portals. Je Eintrag in `datensaetze` wird der Katalog nach dem
# Titel durchsucht (ein Eintrag darf auch eine Datensatz-UUID sein). Übernommen wird je
# Datensatz eine Tabellenzeile als Vorgang – nur unter DL-DE-Zero-2.0 (ohne) oder
# DL-DE-BY-2.0 (mit Namensnennung); alles andere wird gezählt und übersprungen.
# PDF-, WMS- und GIS-Ausgaben werden nicht geladen. Der Probelauf zeigt, welche Titel
# der Katalog zu einem Stichwort führt:
#   python -m behoerdenmaster probe --quelle opendata
[[quellen]]
schluessel = "opendata"
typ = "opendata"
name = "Offene Daten Köln (Datensätze)"
system_url = "https://www.offenedaten-koeln.de"
min_intervall_sekunden = 3.0
lizenz = "Je Datensatz DL-DE-Zero-2.0 (ohne Namensnennung) oder DL-DE-BY-2.0 (mit Namensnennung); andere Lizenzen werden übersprungen"
datensaetze = [
  "Baustellen Köln",
  "Bebauungspläne Köln Aufstellungsbeschlüsse",
]

