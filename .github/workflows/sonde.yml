name: Quellen-Sonde (temporär)

# Nur zur Entwicklung: holt Rohantworten der Kandidaten-Quellen und legt sie im Zweig ab.
# Läuft ausschließlich, wenn sich `sonde/` ändert. Wird nach der Umsetzung entfernt.
on:
  push:
    paths:
      - "sonde/**"

permissions:
  contents: write

jobs:
  sondieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install httpx
      - name: Kandidaten abfragen
        continue-on-error: true
        run: python sonde/hole.py
      - name: Rohantworten in den Zweig schreiben
        if: always()
        shell: bash
        run: |
          set -e
          git add -f sonde-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "sonde: Rohantworten der Kandidaten (temporär)" || echo "nichts zu committen"
          git push origin HEAD:arena/9fc31c25-behoerdenmaster
