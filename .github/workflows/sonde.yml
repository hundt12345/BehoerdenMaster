name: Quellen-Sonde (temporär)

# NUR zur einmaligen Erfassung von Originalantworten der Behörden-Endpunkte während
# der Entwicklung. Läuft ausschließlich, wenn sich `.sonde/` ändert, und wird nach der
# Umsetzung samt Verzeichnis entfernt. Nicht Teil der regulären Testsuite.
on:
  push:
    paths:
      - ".sonde/**"

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Abrufe durchführen
        shell: bash
        run: |
          set -u
          mkdir -p sonde
          UA="BehoerdenMaster/0.1 (+https://github.com/hundt12345/BehoerdenMaster; Kontakt: behordenkontakt123@posteo.de)"
          hole() {
            name="$1"; url="$2"
            code=$(curl -sS -L --max-time 60 -A "$UA" \
              -H 'Accept: text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8' \
              -o "sonde/$name.roh" -w '%{http_code}' "$url" || echo "000")
            echo "$name|$code|$url" >> sonde/manifest.txt
            echo "== $name -> HTTP $code ($(wc -c < "sonde/$name.roh" 2>/dev/null || echo 0) Bytes)"
          }
          hole robots-stadtkoeln        "https://www.stadt-koeln.de/robots.txt"
          hole robots-meinungfuer       "https://meinungfuer.koeln/robots.txt"
          hole robots-offenedaten       "https://www.offenedaten-koeln.de/robots.txt"
          hole bekanntmachungen-2026    "https://www.stadt-koeln.de/politik-und-verwaltung/bekanntmachungen/oeffentliche-bekanntmachungen-2026"
          hole bekanntmachungen-2025    "https://www.stadt-koeln.de/politik-und-verwaltung/bekanntmachungen/oeffentliche-bekanntmachungen-2025"
          hole bekanntmachungen-buchstabeU "https://www.stadt-koeln.de/politik-und-verwaltung/bekanntmachungen/oeffentliche-bekanntmachungen-2026?letter=U"
          hole meinungfuer-projekte     "https://meinungfuer.koeln/mitmachen/alle-projekte"
          hole meinungfuer-rss          "https://meinungfuer.koeln/rss"
          hole meinungfuer-feed         "https://meinungfuer.koeln/feed"
          hole meinungfuer-sitemap      "https://meinungfuer.koeln/sitemap.xml"
          hole offenedaten-katalog      "https://www.offenedaten-koeln.de/api/1/metastore/schemas/dataset/items?page-size=50"
          cat sonde/manifest.txt
      - name: Struktur-Digest
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          S = Path("sonde")

          def roh(name):
              p = S / f"{name}.roh"
              try:
                  return p.read_text(encoding="utf-8", errors="replace")
              except OSError:
                  return ""

          def kopf(titel, text, n=1800):
              print(f"\n########## {titel}\n{text[:n]}")

          b = roh("bekanntmachungen-2026")
          print("\n########## DIGEST bekanntmachungen-2026")
          print("GROESSE", len(b))
          treffer = re.findall(r'<a[^>]*href="([^"]*mediaasset/content/bekanntmachungen/[^"]*)"[^>]*>(.*?)</a>', b, re.S)
          print("ANKER_GESAMT", len(treffer))
          print("DATEINAMEN", [u.rsplit("/", 1)[-1] for u, _ in treffer[:12]])
          if treffer:
              u, txt = treffer[0]
              print("ANKERTEXT_ROH", repr(txt[:700]))
              i = b.index(u)
              print("UMFELD_VORHER", repr(b[max(0, i - 900):i]))
              print("UMFELD_NACHHER", repr(b[i + len(u): i + len(u) + 700]))
          print("KLASSEN", sorted({f"{t}.{c}" for t, c in re.findall(r'<(\w+)[^>]*class="([^"]+)"', b[:40000])})[:60])
          print("LISTEN_TAGS", re.findall(r'<(ul|ol|li|table|tr|td|div|article)[^>]{0,120}>', b[b.find("Download-Liste"):][:1500]) if "Download-Liste" in b else "kein Marker")
          for marker in ("Hinweisver", "mediaasset", "Suchbegriffe", "letter=", "Anzahl", "Pagination", "pager"):
              print("MARKER", marker, b.count(marker))

          u = roh("bekanntmachungen-buchstabeU")
          print("\n########## DIGEST bekanntmachungen-buchstabeU", len(u))
          print("ANKER", len(re.findall(r'mediaasset/content/bekanntmachungen/', u)))

          m = roh("meinungfuer-projekte")
          print("\n########## DIGEST meinungfuer-projekte", len(m))
          print("ALTERNATE", re.findall(r'<link[^>]*rel="alternate"[^>]*>', m))
          print("META", re.findall(r'<meta[^>]*(?:description|og:title)[^>]*>', m)[:3])
          anker = re.findall(r'<a[^>]*href="([^"]*mitmachen[^"]*)"[^>]*>(.*?)</a>', m, re.S)
          print("ANKER_GESAMT", len(anker))
          print("ANKER_ZIELE", [a[0] for a in anker[:12]])
          print("PROJEKT_MARKER", {w: m.count(w) for w in ("Online-Beteiligung", "geschlossen", "Projekt", "card", "teaser", "project")})
          if anker:
              ziel = anker[min(3, len(anker) - 1)][0]
              if ziel.startswith("/"):
                  ziel = "https://meinungfuer.koeln" + ziel
              i = m.find(ziel)
              print("KARTE_UMFELD", repr(m[max(0, i - 2500):i + 2500]) if i > 0 else "Ziel nicht im HTML gefunden")
          print("KLASSEN", sorted({f"{t}.{c}" for t, c in re.findall(r'<(\w+)[^>]*class="([^"]+)"', m)})[:80])
          k = roh("meinungfuer-rss")
          f = roh("meinungfuer-feed")
          s = roh("meinungfuer-sitemap")
          print("\n########## RSS?", len(k), len(f), "SITEMAP", len(s))
          print("RSS_KOPF", repr(k[:200]))
          print("FEED_KOPF", repr(f[:200]))
          print("SITEMAP_KOPF", repr(s[:400]))

          print("\n########## DIGEST offenedaten-katalog")
          try:
              katalog = json.loads(roh("offenedaten-katalog"))
          except ValueError as exc:
              print("KEIN JSON", exc)
              katalog = None
          if katalog:
              print("ANZAHL", len(katalog))
              print("TITEL", [d.get("title") for d in katalog][:50])
              urls = sorted({v.get("downloadURL", "") for d in katalog
                             for v in (d.get("distribution") or []) if isinstance(v, dict)})
              print("EIGENE_URLS", [u for u in urls if "offenedaten-koeln.de" in u][:20])
              print("EXTERNE_HOSTS", sorted({re.sub(r"^https?://([^/]+).*$", r"\1", u) for u in urls if u})[:20])
          PY
