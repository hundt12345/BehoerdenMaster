[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "behoerdenmaster"
version = "0.1.0"
description = "Kommunale Vorgänge (Ratsinformation, OParl) durchsuchen und verständlich zusammenfassen"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "protego>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
behoerdenmaster = "behoerdenmaster.cli:main"

[tool.setuptools.packages.find]
include = ["behoerdenmaster*"]

[tool.setuptools.package-data]
behoerdenmaster = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
